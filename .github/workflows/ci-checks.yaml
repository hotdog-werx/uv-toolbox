# generated by hotdogwerx-devkit-workspace@0.1.0 - manual changes may be overwritten
name: ci-checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  repo-checks:
    uses: hotdog-werx/devkit/.github/workflows/__workspace_repo-checks.yaml@v0
    with:
      enable-docs: true

  python-checks:
    uses: hotdog-werx/devkit/.github/workflows/__python_python-checks.yaml@v0
    with:
      operating-systems: '["ubuntu-latest", "windows-latest"]'
      codecov: true
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ## start-custom-ci-checks
  uv-compatibility:
    # The integration tests drive the real `uv` CLI, so run them against the
    # latest patch of every uv minor from MIN_UV_VERSION (uv_toolbox/project.py)
    # up to the version pinned in mise.toml. Keep both ends in sync with this list.
    name: uv ${{ matrix.uv }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        uv: ['0.8.24', '0.9.30', '0.10.12', '0.11.33', '0.12.24']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv
        # Needed before mise: its postinstall hooks run uv-toolbox and
        # `repolish link`, which provides the python:* tasks. Mirrors devkit's
        # python-checks workflow.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: '**/pyproject.toml'
      - name: Install mise tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - name: Install python dependencies
        run: mise run python:uv-sync
      - name: Put the project venv on PATH
        # The tests run `uvtb` from here; it calls whichever `uv` is first on PATH.
        run: echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Install uv ${{ matrix.uv }}
        # Added to PATH after mise's tool paths, so it takes precedence over the
        # uv pinned in mise.toml for the rest of the job.
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: ${{ matrix.uv }}
          enable-cache: false
      - name: Run integration tests with uv ${{ matrix.uv }}
        env:
          UV_VERSION: ${{ matrix.uv }}
        run: |
          set -o pipefail
          command -v uv
          uv --version
          uv --version | grep -F "uv $UV_VERSION "
          python -m pytest tests/integration
  ## end-custom-ci-checks
